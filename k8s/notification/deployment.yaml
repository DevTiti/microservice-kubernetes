apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service

          image: notification-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8086

          env:
          - name: NOTIFICATION_DB_URL
            valueFrom:
              secretKeyRef:
                name: database-urls
                key: NOTIFICATION_DB_URL