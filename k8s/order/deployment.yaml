apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service

          image: order-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8084

          env:
            - name: ORDER_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: ORDER_DB_DSN
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: CATALOG_URL

            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: INVENTORY_URL

            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: NOTIFICATION_URL