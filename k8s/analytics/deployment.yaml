apiVersion: apps/v1
kind: Deployment

metadata:
  name: analytics-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      containers:
        - name: analytics-service

          image: analytics-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8087

          env:
            - name: ANALYTICS_DB_DSN
              value: "pgsql:host=postgres;port=5432;dbname=analytics_db"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MICROAPP_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MICROAPP_PASSWORD
