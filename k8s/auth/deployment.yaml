apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: auth-service:local

          # The image exists inside the Kind node,
          # so Kubernetes must not try Docker Hub.
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          env:
            - name: AUTH_DB_URL
              value: jdbc:postgresql://postgres:5432/auth_db

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MICROAPP_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: MICROAPP_PASSWORD