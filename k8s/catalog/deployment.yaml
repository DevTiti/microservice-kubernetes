apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalog-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalog-service

  template:
    metadata:
      labels:
        app: catalog-service

    spec:
      containers:
        - name: catalog-service

          image: catalog-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8082

          env:
          - name: CATALOG_DB_DSN
            valueFrom:
              secretKeyRef:
                name: database-urls
                key: CATALOG_DB_DSN