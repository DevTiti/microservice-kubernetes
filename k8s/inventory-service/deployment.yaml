apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-service

  template:
    metadata:
      labels:
        app: inventory-service

    spec:
      containers:
        - name: inventory-service

          image: inventory-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8083

          env:
          - name: INVENTORY_DB_URL
            valueFrom:
              secretKeyRef:
                name: database-urls
                key: INVENTORY_DB_URL