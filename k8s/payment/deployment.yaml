apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service

          image: payment-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 8085

          env:
            - name: PAYMENT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: PAYMENT_DB_URL
            - name: ORDER_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: ORDER_URL

            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: INVENTORY_URL

            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: payment-service-config
                  key: NOTIFICATION_URL

                startupProbe:
                  httpGet:
                    path: /health
                    port: 8081
                  periodSeconds: 5
                  failureThreshold: 30

                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3

                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8081
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 2
                  failureThreshold: 3