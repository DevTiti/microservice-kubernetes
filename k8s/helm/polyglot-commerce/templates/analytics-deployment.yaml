apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.analytics.name }}
spec:
  replicas: {{ .Values.services.analytics.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Values.services.analytics.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.analytics.name }}
    spec:
      serviceAccountName: {{ .Values.services.analytics.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.services.analytics.name }}
          image: "{{ .Values.services.analytics.image.repository }}:{{ .Values.services.analytics.image.tag }}"
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.services.analytics.port }}
          env:
            - name: ANALYTICS_DB_DSN
              value: "pgsql:host=postgres;port=5432;dbname=analytics_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.secretName }}
                  key: MICROAPP_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.secretName }}
                  key: MICROAPP_PASSWORD
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.services.analytics.name }}-config
                  key: CATALOG_URL
            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.services.analytics.name }}-config
                  key: INVENTORY_URL
            - name: ORDER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.services.analytics.name }}-config
                  key: ORDER_URL
            - name: PAYMENT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.services.analytics.name }}-config
                  key: PAYMENT_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.analytics.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.analytics.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
