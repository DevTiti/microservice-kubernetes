apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.services.catalog.name }}

spec:
  replicas: {{ .Values.services.catalog.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.catalog.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.catalog.name }}

    spec:
      serviceAccountName: catalog-service
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

      containers:
        - name: catalog-service

          image: "{{ .Values.services.catalog.image.repository }}:{{ .Values.services.catalog.image.tag }}"

          imagePullPolicy: Never

          ports:
            - containerPort: {{ .Values.services.catalog.port }}

          env:
            - name: CATALOG_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: CATALOG_DB_DSN

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}