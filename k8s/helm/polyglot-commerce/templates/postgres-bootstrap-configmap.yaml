apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.databaseInitialization.configMapName }}
data:
  bootstrap.sql: |
    \set ON_ERROR_STOP on

    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user')\gexec

    SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password')\gexec

{{- range .Values.databaseInitialization.databases }}
    SELECT format('CREATE DATABASE %I OWNER %I', {{ . | squote }}, :'app_user')
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = {{ . | squote }})\gexec

{{- end }}
