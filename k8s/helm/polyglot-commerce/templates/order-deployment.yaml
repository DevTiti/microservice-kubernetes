apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.services.order.name }}

spec:
  replicas: {{ .Values.services.order.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.order.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.order.name }}

    spec:
      serviceAccountName: order-service
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: order-service

          image: "{{ .Values.services.order.image.repository }}:{{ .Values.services.order.image.tag }}"

          imagePullPolicy: Never

          ports:
            - containerPort: {{ .Values.services.order.port }}

          env:
            - name: ORDER_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseConnections.secretName }}
                  key: ORDER_DB_DSN

            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: CATALOG_URL

            - name: INVENTORY_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: INVENTORY_URL

            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: NOTIFICATION_URL

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          startupProbe:
            tcpSocket:
              port: {{ .Values.services.order.port }}
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.services.order.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: {{ .Values.services.order.port }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
